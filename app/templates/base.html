<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <a href="{{ url_for('routes.dashboard_page') }}" class="sidebar-brand">
                <i class="bi bi-mortarboard-fill fs-3 text-primary"></i>
                <span>EduAdmin</span>
            </a>
            <div class="sidebar-nav">
                <div class="text-uppercase text-secondary small fw-bold px-3 mb-2" style="font-size: 0.75rem;">Menu</div>
                <nav class="nav flex-column">
                    <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('routes.dashboard_page') }}">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                    <a class="nav-link {% if active_page == 'students' %}active{% endif %}" href="{{ url_for('routes.students_page') }}">
                        <i class="bi bi-people-fill"></i>
                        <span>Students</span>
                    </a>
                    <a class="nav-link {% if active_page == 'add_student' %}active{% endif %}" href="{{ url_for('routes.student_add_page') }}">
                        <i class="bi bi-person-plus-fill"></i>
                        <span>Add Student</span>
                    </a>
                </nav>

                <hr class="my-4 text-muted">
                <div class="px-3">
                    <small class="text-muted d-block mb-1">Architecture</small>
                    <div class="d-flex align-items-center gap-2 small text-secondary">
                        <span class="badge bg-primary">Flask</span>
                        <span class="badge bg-warning text-dark">MySQL</span>
                        <span class="badge bg-info text-dark">Docker</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div id="main-content" class="flex-grow-1">
            <!-- Top Navbar -->
            <header class="top-navbar d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('show')">
                        <i class="bi bi-list"></i>
                    </button>
                    <h5 class="mb-0 fw-bold text-dark">{% block page_heading %}Student Management System{% endblock %}</h5>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
                        <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i> System Online
                    </span>
                    <a href="{{ url_for('routes.student_add_page') }}" class="btn btn-sm btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Add Student
                    </a>
                </div>
            </header>

            <!-- Main Body Content -->
            <main class="container-fluid p-4">
                <!-- Dynamic Alert Container -->
                <div id="alert-container"></div>

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
